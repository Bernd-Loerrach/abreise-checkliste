<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ef"/>
    </linearGradient>
    <filter id="flagShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a3a24" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Portuguese flag -->
  <g filter="url(#flagShadow)">
    <text x="256" y="268" font-size="300" text-anchor="middle">🇵🇹</text>
  </g>

  <!-- App name -->
  <text x="256" y="372" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="52" font-weight="800" fill="#0a7d4b" text-anchor="middle" letter-spacing="-1">Bernd&apos;s</text>
  <text x="256" y="420" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="40" font-weight="700" fill="#2d3b35" text-anchor="middle" letter-spacing="-0.5">Vocabulary</text>
  <text x="256" y="462" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="40" font-weight="700" fill="#c1272d" text-anchor="middle" letter-spacing="-0.5">App</text>
</svg>
