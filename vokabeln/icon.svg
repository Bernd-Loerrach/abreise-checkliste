<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e9a5c"/>
      <stop offset="1" stop-color="#076b3e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Karteikarte -->
  <g filter="url(#sh)" transform="rotate(-7 256 256)">
    <rect x="96" y="150" width="320" height="212" rx="34" fill="#ffffff"/>
    <text x="256" y="292" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" fill="#0e9a5c" text-anchor="middle" letter-spacing="-4">olá</text>
  </g>
  <!-- kleine Flaggen-Akzent-Punkte -->
  <circle cx="150" cy="406" r="15" fill="#f5c518"/>
  <circle cx="196" cy="406" r="15" fill="#ffffff" opacity="0.9"/>
  <circle cx="242" cy="406" r="15" fill="#f5c518"/>
</svg>
